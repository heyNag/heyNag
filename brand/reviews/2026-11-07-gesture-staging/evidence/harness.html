<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>heyNag gesture and staging evidence</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f1ef;color:#252923;font:14px/1.4 system-ui}main{padding:20px}h1{font-size:22px}h2{font-size:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cell{padding:8px;background:#eaf0dc;min-width:0}.night{background:#202b21;color:#edf2db}.art{height:260px}.label{font-size:12px;margin:5px 0}.row{display:flex;align-items:end;gap:14px;margin:16px 0}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.timeline .art{height:175px}.all{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}.pair .art{height:180px}.round{border-radius:50%}.header{width:390px;height:auto}.art svg{width:100%;height:100%}</style><main id="main"></main>
<script src="../before/animation-v5/character.js"></script><script src="../before/animation-v5/motion.js"></script><script>window.BeforeCharacter=HeyNagCharacter;window.BeforeMotion=HeyNagMotion;</script><script src="../../../animation-v5/character.js"></script><script src="../../../animation-v5/motion.js"></script><script src="../../../source/applications-v5.js"></script>
<script src="candidate-data.js"></script><script>
const q=new URLSearchParams(location.search),mode=q.get('page')||'paint',root=document.getElementById('main');
function el(tag,cls,parent,text){const e=document.createElement(tag);e.className=cls||'';if(text)e.textContent=text;(parent||root).append(e);return e}
function art(parent,theme,pose,label='',before=false,size=260,paint){const box=el('div','cell '+(theme==='night'?'night':''),parent);if(label)el('div','label',box,label);const h=el('div','art',box);h.style.height=size+'px';if(size<=160)h.style.width=size+'px';const rig=new(before?BeforeCharacter:HeyNagCharacter)(h,{theme,paintVariant:paint});rig.render(pose);return rig}
window.makeArt=art;
if(mode==='paint'){el('h1','','', 'Paint alternatives / identical geometry and pose');for(const theme of ['day','night']){el('h2','','',theme);const g=el('div','grid');for(const paint of ['baseline','quiet-antenna','reduced-rim','soft-falloff','refined'])art(g,theme,HeyNagMotion.sample(q.get('id')||'curious',1160),paint,false,290,paint)}}
if(mode==='poses'){el('h1','','','Hand staging / before left, updated right');const g=el('div','all');for(const id of ['curious-investigate','thinking','focused','grateful','shy','worried']){const row=el('div','',g);el('h2','',row,id);const p=el('div','pair',row);for(const before of [true,false]){const m=before?BeforeMotion:HeyNagMotion;art(p,q.get('theme')||'day',m.sample(id,(m.clips[id]||m.variants[id]).stillTime),before?'Before':'Updated',before,240)}}}
if(mode==='all'){el('h1','','','24 emotions / updated day and night');const g=el('div','all');for(const[id,c]of Object.entries(HeyNagMotion.clips)){const box=el('div','',g);el('div','label',box,c.label);const p=el('div','pair',box);for(const theme of ['day','night'])art(p,theme,HeyNagMotion.sample(id,c.stillTime),'',false,180)}}
if(mode==='sequence'){const id=q.get('id')||'curious-investigate',theme=q.get('theme')||'day';const defaults=id==='excited'?[380,550,720,850,980,1060,1100,1140,1230,1410,2060,3000]:id==='mischievous-one-peek'?[0,240,440,800,1050,1250,1500,1800,2050,2260,2510,2750]:id==='surprised'?[0,70,140,230,310,450,650,850,1100,1550,2200,2600]:[0,150,330,790,1190,1610,1900,2350,2720,3050,3520,4100];const times=q.has('times')?q.get('times').split(',').map(Number):defaults;el('h1','','',id+' / '+theme+' / authored poses');const g=el('div','timeline');for(const t of times)art(g,theme,HeyNagMotion.sample(id,t),t+' ms',false,190)}
if(mode==='sizes'){el('h1','','','Actual CSS sizes / current paint');for(const theme of ['day','night']){const row=el('div','row cell '+(theme==='night'?'night':''));for(const size of [32,48,64]){const b=el('div','',row);el('div','label',b,size+'px');const im=el('img','round',b);im.width=im.height=size;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(HeyNagApplications.create('avatar',theme))}for(const size of [96,128,160])art(row,theme,HeyNagMotion.sample(q.get('id')||'thinking',1400),size+'px',false,size)}for(const theme of ['light','dark']){const im=el('img','header');im.src='../../../../assets/brand/header-v5-'+theme+'.png'}}
if(mode==='transition'){const from=q.get('from')||'sad',to=q.get('to')||'worried';el('h1','','',from+' → '+to+' / deterministic engine poses');const g=el('div','timeline');let now=0,cb;const engine=new HeyNagMotion.Engine({scheduler:{now:()=>now,requestAnimationFrame:f=>(cb=f,1),cancelAnimationFrame:()=>cb=null}});engine.seek(from,from==='excited'?850:HeyNagMotion.clips[from].duration);engine.play(to);for(const t of [0,40,100,180,260,380,500,700,1000,1400,2000,3000]){while(now<t){now=Math.min(t,now+10);const f=cb;cb=null;if(f)f()}art(g,q.get('theme')||'day',engine.pose,t+' ms',false,190)}engine.destroy()}

if(mode==='gesture-sizes'){el('h1','','','Hand gestures / actual CSS sizes');for(const id of(q.get('id')?[q.get('id')]:['curious-investigate','thinking','grateful','shy','worried'])){el('h2','','',q.has('unlabelled')?'Study':id);for(const theme of ['day','night']){const row=el('div','row');for(const size of [96,128,160,240]){for(const before of [true,false]){const M=before?BeforeMotion:HeyNagMotion,c=M.clips[id]||M.variants[id];art(row,theme,M.sample(id,c.stillTime),(before?'Before ':'Updated ')+size+'px',before,size)}}}}}

if(mode==='candidates'){el('h1','','','Offering hand / same face, body, wings and scale');for(const theme of ['day','night']){el('h2','','',theme);const g=el('div','all');g.style.gridTemplateColumns='repeat(4,1fr)';const base=BeforeMotion.sample('curious-investigate',2720);art(g,theme,base,'Before',true,300);for(const c of HAND_CANDIDATES.offeringCandidates)art(g,theme,{...base,...c.patch},c.id,false,300)}}
window.auditReady=true;
</script></html>
