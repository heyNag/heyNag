<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>heyNag frozen audit comparisons</title>
<style>*{box-sizing:border-box}body{font:15px/1.5 system-ui;margin:0;background:#f1f1ef;color:#252923}h1{font-size:26px}h2{font-size:19px}main{padding:24px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cell{background:#eaf0dc;padding:12px;min-width:0}.night{background:#202b21;color:#eaf0dc}.art{height:300px;display:flex;align-items:center;justify-content:center}.art img{height:100%;max-width:100%;object-fit:contain}.art svg{max-width:100%}.label{font-size:13px;margin:6px 0}.sizes{display:flex;align-items:end;gap:28px;min-height:200px}.sizes .size{text-align:center}.sizes img{display:block;object-fit:contain}.avatar{border-radius:50%;background:#fff}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.timeline .art{height:210px}.all{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.all .art{height:180px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pair .art{height:160px}section{margin-bottom:24px}body[data-page=sequence] .timeline{grid-template-columns:repeat(5,1fr)}body[data-page=sequence] .timeline .art{height:220px}</style>
<main id="main"></main><script src="../../../animation-v5/character.js"></script><script src="../../../animation-v5/motion.js"></script><script>
const root=document.getElementById('main'), page=new URLSearchParams(location.search).get('page')||'identity';document.body.dataset.page=page;
const assets='../../../../assets/brand/';
function element(tag,cls,parent,text){const e=document.createElement(tag);e.className=cls||'';if(text)e.textContent=text;(parent||root).append(e);return e}
function art(parent,theme,pose,label){const c=element('div','cell '+(theme==='night'?'night':''),parent);element('div','label',c,label);const host=element('div','art',c);const rig=new HeyNagCharacter(host,{theme});rig.render(pose);return rig}
function raster(parent,name,theme,label){const c=element('div','cell '+(theme==='night'?'night':''),parent);element('div','label',c,label);const host=element('div','art',c),im=element('img','',host);im.src=assets+name;return im}
function title(s){element('h1','',root,s)}
if(page==='identity'){
 title('Same character? Current raster, articulated drawing, and legacy application');
 const g=element('section','grid');raster(g,'heynag-moth-v5-refined.png','day','V5 refined raster / day');art(g,'day',HeyNagMotion.neutral,'V5 rig / rest / day');raster(g,'heynag-moth-v5-night.png','night','V5 raster / night');art(g,'night',HeyNagMotion.neutral,'V5 rig / rest / night');
 element('h2','',root,'V5 full body at actual CSS sizes');
 for(const theme of ['day','night']){const s=element('section','cell '+(theme==='night'?'night':''));element('div','label',s,theme+' / raster above, rig below');for(const kind of ['raster','rig']){const row=element('div','sizes',s);for(const size of [32,48,64,96,128,160]){const box=element('div','size',row);if(kind==='raster'){const im=element('img','',box);im.src=assets+(theme==='day'?'heynag-moth-v5-refined.png':'heynag-moth-v5-night.png');im.style.width=size+'px';im.style.height=size+'px'}else{const host=element('div','',box);host.style.width=size+'px';host.style.height=size+'px';new HeyNagCharacter(host,{theme})}element('div','label',box,size+'px')}}}
 element('h2','',root,'Legacy V2 avatar / circular context / not a V5 avatar');const row=element('section','sizes cell');for(const size of [24,32,48,64,96,128]){const box=element('div','size',row);const im=element('img','avatar',box);im.src=assets+'heynag-moth-avatar-v2.png';im.width=im.height=size;element('div','label',box,size+'px')}
}else if(page==='all'){
 title('24 held performances / day and night / same pose');const g=element('section','all');for(const [id,c]of Object.entries(HeyNagMotion.clips)){const box=element('div','',g);element('div','label',box,c.label+' · '+c.stillTime+'ms');const p=element('div','pair',box);for(const t of ['day','night'])art(p,t,HeyNagMotion.sample(id,c.stillTime),'')}
}else if(page==='sequence'){
 const id=new URLSearchParams(location.search).get('id')||'excited';const times=id==='thinking'?[0,700,1200,1400,1730,1920,2200,2590,3000,4100]:id==='scared'?[0,200,400,600,850,1050,1300,1600,2000,2800]:id==='excited'?[0,160,380,550,720,800,900,980,1060,1410]:id==='curious'?[0,160,320,520,760,960,1160,1540,2000,2800]:[0,160,320,550,800,1150,1500,1900,2400,3000];title(id+' / exact source poses in milliseconds (not video frames)');const g=element('section','timeline');for(const time of times)art(g,'day',HeyNagMotion.sample(id,time),time+'ms');
}else if(page==='transition'){
 title('Sad → worried / deterministic live-engine transition');const g=element('section','timeline');let now=0,cb=null;const engine=new HeyNagMotion.Engine({scheduler:{now:()=>now,requestAnimationFrame:fn=>(cb=fn,1),cancelAnimationFrame:()=>cb=null}});engine.seek('sad',HeyNagMotion.clips.sad.duration);engine.play('worried');for(const ms of [0,100,200,300,380,500,650,800,970,1160,1500,2000]){while(now<ms){now=Math.min(ms,now+10);const f=cb;cb=null;if(f)f()}art(g,'day',engine.pose,ms+'ms')}engine.destroy();
}
window.auditReady=true;
</script></html>
