<!doctype html><html lang="en"><meta charset="utf-8"><title>Current heyNag reel exporter</title><canvas id="film" width="1280" height="800"></canvas><script src="../../../animation-v5/character.js"></script><script src="../../../animation-v5/motion.js"></script><script>
(()=>{const canvas=document.getElementById('film'),ctx=canvas.getContext('2d'),rigs=['day','night'].map(theme=>new HeyNagCharacter(document.createElement('div'),{theme}));let now=0,callback=null,current=-1,offset=0;const engine=new HeyNagMotion.Engine({scheduler:{now:()=>now,requestAnimationFrame:f=>(callback=f,1),cancelAnimationFrame:()=>callback=null}});let frame=0;const segments=Object.values(HeyNagMotion.clips).map(c=>{const s={id:c.id,label:c.label,startFrame:frame,frames:Math.ceil((c.duration+500)*30/1000),duration:c.duration};frame+=s.frames;return s});
const img=svg=>new Promise((resolve,reject)=>{const u=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml'})),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);resolve(i)};i.onerror=reject;i.src=u});
window.CurrentFrames={segments,frames:frame,async chunk(start,count){const images=[];for(let n=start;n<start+count;n++){const index=segments.findIndex(s=>n>=s.startFrame&&n<s.startFrame+s.frames),s=segments[index];if(index!==current){current=index;offset=now;engine.play(s.id)}const target=offset+(n-s.startFrame)*1000/30;while(now<target){now=Math.min(target,now+1000/120);const f=callback;callback=null;if(f)f()}const arts=await Promise.all(rigs.map(r=>{r.render(engine.pose);return img(r.svg)}));ctx.fillStyle='#f1f1ef';ctx.fillRect(0,0,1280,800);ctx.fillStyle='#252923';ctx.font='36px system-ui';ctx.fillText('heyNag.',42,62);ctx.font='26px system-ui';ctx.textAlign='right';ctx.fillText(s.label,1238,62);ctx.textAlign='left';for(let i=0;i<2;i++){const x=i*640;ctx.fillStyle=i?'#202b21':'#eaf0dc';ctx.fillRect(x+12,96,616,638);ctx.drawImage(arts[i],x+40,110,550,567);ctx.fillStyle=i?'#bdcba7':'#526248';ctx.font='14px system-ui';ctx.fillText(i?'After dark':'Daylight',x+32,718)}ctx.fillStyle='#526248';ctx.font='16px system-ui';ctx.fillText('A little moth. A lot of feelings.',42,774);ctx.textAlign='right';ctx.fillText(`${index+1} / 24`,1238,774);ctx.textAlign='left';images.push(canvas.toDataURL('image/png').split(',')[1])}return images;}};window.auditReady=true;})();
</script></html>
